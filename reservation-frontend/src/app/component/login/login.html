<section class="auth" aria-labelledby="login-title">
  <div class="auth__header">
    <h1 id="login-title">Iniciar sesión</h1>
  </div>

  <form [formGroup]="form" (ngSubmit)="enviar()" novalidate>
    <div class="field">
      <label for="mail">Mail</label>
      <input
        id="mail"
        type="email"
        formControlName="mail"
        autocomplete="email"
        [attr.aria-invalid]="campoInvalido('mail')"
      />
      @if (campoInvalido('mail')) {
        <span class="field__error" role="alert">Ingresá un mail válido.</span>
      }
    </div>

    <div class="field">
      <label for="contrasenia">Contraseña</label>
      <input
        id="contrasenia"
        type="password"
        formControlName="contrasenia"
        autocomplete="current-password"
        [attr.aria-invalid]="campoInvalido('contrasenia')"
      />
      @if (campoInvalido('contrasenia')) {
        <span class="field__error" role="alert">Este campo es obligatorio.</span>
      }
    </div>

    <div class="actions">
      <button type="submit" class="btn-primary" [disabled]="submitting()">
        @if (submitting()) {
          Ingresando…
        } @else {
          Ingresar
        }
      </button>
    </div>

    <p class="auth__switch">¿No tenés cuenta? <a routerLink="/register">Registrate</a></p>
  </form>
</section>
